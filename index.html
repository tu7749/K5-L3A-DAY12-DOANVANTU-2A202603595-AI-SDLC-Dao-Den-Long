<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đảo Đèn Lồng · Ba hòn đảo</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<main id="world" aria-label="Đảo Đèn Lồng 3D"></main>
<header><div class="brand">✦ ĐẢO ĐÈN LỒNG<small id="nightLabel"></small></div><button id="pause">Tạm dừng · Esc / P</button></header>
<section id="hud"><div class="health"><small>NGỌN LỬA</small><strong id="health"></strong></div><div class="clock"><small>TRƯỚC BÌNH MINH</small><span id="warning" hidden>⚠ </span><strong id="time"></strong></div><div class="progress"><small>ĐÈN ĐANG SÁNG</small><strong id="lit"></strong><small>ĐIỂM <b id="score"></b></small></div></section>
<div id="toast" role="status"></div><div id="wind"></div><div id="arrow" hidden>▲ <span></span></div>
<div id="hint"></div><div id="inventory"><div id="slots"></div><small id="carry"></small></div><div id="cooldowns"><div id="dash"></div><div id="pulse"></div><div id="charm"></div></div>
<footer>WASD · di chuyển &nbsp; Space · nhảy &nbsp; Shift · lướt &nbsp; E · nạp đèn &nbsp; Q · tỏa sáng &nbsp; Kéo chuột · xoay camera</footer>
<section id="overlay"><div class="panel"><span class="eyebrow">MỘT HÀNH TRÌNH GIỮA BIỂN MÂY</span><h1 id="title"></h1><p id="description"></p><div id="actions"></div></div></section>
<dialog id="settings"><h2>Cài đặt</h2><label>Âm lượng <input id="volume" type="range" min="0" max="1" step="0.05"></label><label>Độ nhạy chuột <input id="sensitivity" type="range" min="0.001" max="0.015" step="0.001"></label><label class="toggle"><input id="colorblind" type="checkbox"> Bảng màu dễ phân biệt</label><button id="closeSettings">Xong</button></dialog>
<script type="module" src="src/browser.js"></script></body></html>
